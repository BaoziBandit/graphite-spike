name: tauri-spike
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri icon app-icon.png
      - run: npx tauri build --bundles nsis
      - name: Rename installer
        shell: pwsh
        run: Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1 | Copy-Item -Destination graphite-spike-${{ github.ref_name }}-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: graphite-spike-${{ github.ref_name }}-windows-x64-setup.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build arm64 APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          npx tauri icon app-icon.png
          npx tauri android build --apk --target aarch64
      - name: Debug-sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android -name '*release*.apk' | head -1)
          echo "Unsigned APK: $APK"
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out graphite-spike-${{ github.ref_name }}-android-arm64.apk aligned.apk
          "$BT/apksigner" verify --print-certs graphite-spike-${{ github.ref_name }}-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: graphite-spike-${{ github.ref_name }}-android-arm64.apk
  release:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: Graphite WP0 spike ${{ github.ref_name }}
          body: "Throwaway WP0 performance-spike test shells (Tauri v2). Windows installer is unsigned (SmartScreen: More info > Run anyway). Android APK is debug-signed, arm64, sideload only."
          files: dist/*
